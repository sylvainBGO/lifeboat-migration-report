name: Benchmark source contracts
on:
  workflow_dispatch:
concurrency:
  group: microbench-contracts-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reports, interruptions, ownership and synthetic I/O
        run: python -m unittest discover -s performance/benchmarks -v
      - name: Exercise JSON and readable report with synthetic I/O
        shell: pwsh
        run: |
          python performance/benchmarks/benchmark.py --headless --mode quick --focus io --directory C:/lb-io
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic I/O campaign failed' }
          $report = Get-ChildItem C:/lb-io/benchmark-lifeboat-*.json | Select-Object -Last 1
          $r = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if (-not $r.passed -or $r.trials.Count -ne 6) { throw 'Incomplete I/O campaign' }
          if (-not (Test-Path ([IO.Path]::ChangeExtension($report.FullName, '.txt')))) { throw 'Missing readable report' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Benchmark-Source-Evidence
          path: C:/lb-io/benchmark-lifeboat-*

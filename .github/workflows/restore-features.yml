name: Restore recovery feature regression
on:
  push:
    paths: ['features/**', 'performance/optimizations/**', 'performance/benchmarks/**', '.github/workflows/restore-features.yml']
  workflow_dispatch:
concurrency:
  group: restore-features-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dkwolf1/Codex-Lifeboat
          ref: 4fe9724ccb54422455544e56b54399fa2bc94bc3
          path: upstream
      - uses: actions/checkout@v4
        with:
          repository: dkwolf1/Codex-Lifeboat
          ref: 4fe9724ccb54422455544e56b54399fa2bc94bc3
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r upstream/requirements-build.txt Pillow==11.3.0
      - name: Apply performance baseline and recovery building blocks
        working-directory: upstream
        run: |
          python -c "from pathlib import Path; paths=list(Path('src').rglob('*.py'))+[Path('../performance/optimizations/restore-first-pass.patch'),Path('../features/resume-copy-foundation.patch'),Path('../features/completion.patch')]; [p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10]))) for p in paths]"
          git apply ../performance/optimizations/restore-first-pass.patch
          if ($LASTEXITCODE -ne 0) { throw 'Performance patch failed' }
          git apply ../features/resume-copy-foundation.patch
          if ($LASTEXITCODE -ne 0) { throw 'Recovery feature patch failed' }
          git apply ../features/completion.patch
          if ($LASTEXITCODE -ne 0) { throw 'Completion patch failed' }
      - name: Component and Windows failure-injection tests
        working-directory: upstream
        run: python benchmarks/run_completion_tests.py --output ../evidence/component-test-results.json
      - name: Official source regression including GUI and rollback
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd/upstream/src"
          python -c "from pathlib import Path; from codex_transfer.selftest import run_self_test; r=run_self_test(Path('C:/lb-feat')); print(r['checks']); assert r['passed']"
          if ($LASTEXITCODE -ne 0) { throw 'Restore regression failed' }
      - name: Capture synthetic UI evidence
        run: python upstream/benchmarks/capture_recovery_ui.py ui-evidence
      - name: Benchmark contracts and synthetic UI
        run: |
          python -m unittest discover -s performance/benchmarks -p test_benchmark_delivery.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark contracts failed' }
          python performance/benchmarks/verify_benchmark_gui.py --directory benchmark-ui-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark UI failed' }
      - name: Build community Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Codex-Lifeboat-Community --paths upstream/src --distpath delivery --workpath build-temp --specpath build-temp upstream/src/run_codex_transfer.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Test packaged executable and packaged recovery
        shell: pwsh
        run: |
          $exe = "$pwd/delivery/Codex-Lifeboat-Community.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test --work C:/lb-exe' -Wait -PassThru
          $r = Get-Content C:/lb-exe/self-test-result.json -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.passed) { throw 'Packaged regression failed' }
          if (-not $r.phase11Matrix -or $r.phase11Matrix.automatedPassed -ne $r.phase11Matrix.automatedTotal) { throw 'Packaged compatibility matrix failed' }
          $p = Start-Process -FilePath $exe -ArgumentList '--recovery-self-test --work C:/lb-resume' -Wait -PassThru
          $r = Get-Content C:/lb-resume/recovery-self-test-result.json -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.passed) { throw 'Packaged recovery failed' }
          $p = Start-Process -FilePath $exe -ArgumentList '--archive-self-test --work C:/lb-archive' -Wait -PassThru
          $r = Get-Content C:/lb-archive/recovery-self-test-result.json -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.passed -or $r.projectStorage -ne 'archive-blocks-v1') { throw 'Packaged archive recovery failed' }
          python -c "from pathlib import Path; p=Path('C:/lb-warm/.codex/sessions'); p.mkdir(parents=True); [(p/f'rollout-{n}.jsonl').write_text('{}\n') for n in range(3)]"
          $p = Start-Process -FilePath $exe -ArgumentList '--warm-recent 3 --codex-home C:/lb-warm/.codex --report C:/lb-warm/warmup-test-result.json' -Wait -PassThru
          $r = Get-Content C:/lb-warm/warmup-test-result.json -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or $r.status -ne 'completed' -or $r.mode -ne 'os_file_cache' -or $r.applicationPreloadSupported -or $r.filesRead -ne 3) { throw 'Packaged local pre-read failed' }
      - name: Launch and close packaged GUI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$pwd/delivery/Codex-Lifeboat-Community.exe" -PassThru
          $until = (Get-Date).AddSeconds(30)
          # PyInstaller onefile keeps a parent process; the child owns Tk's window.
          do {
            Start-Sleep -Milliseconds 500
            $window = Get-Process -Name Codex-Lifeboat-Community -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            $p.Refresh()
          } while (-not $p.HasExited -and -not $window -and (Get-Date) -lt $until)
          if (-not $window) { throw 'Packaged GUI did not open' }
          if ($window.MainWindowTitle -notlike '*Lifeboat*') { throw "Unexpected packaged window: $($window.MainWindowTitle)" }
          $window.CloseMainWindow() | Out-Null
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'Packaged GUI did not close normally' }
      - name: Build and measure packaged benchmark
        shell: pwsh
        run: |
          ./performance/benchmarks/build-windows.ps1 -BaselineSource baseline/src -FinalSource upstream/src -OutputDirectory benchmark-delivery
          $p = Start-Process -FilePath "$pwd/benchmark-delivery/Lifeboat-Benchmark.exe" -ArgumentList '--headless --mode quick --focus all --include-archives --directory C:/lb-bench-quick' -Wait -PassThru
          $report = Get-ChildItem C:/lb-bench-quick/benchmark-lifeboat-*.json | Sort-Object Name | Select-Object -Last 1
          if (-not $report) { throw 'Packaged benchmark report missing' }
          $r = Get-Content $report.FullName -Raw | ConvertFrom-Json
          $r.comparisons | ConvertTo-Json -Depth 6
          $r.archive_comparisons | ConvertTo-Json -Depth 6
          if ($p.ExitCode -ne 0 -or -not $r.passed) { throw 'Packaged benchmark failed' }
          if (-not $r.archive_comparisons) { throw 'Packaged archive comparisons missing' }
      - name: Package tested binaries and sources
        shell: pwsh
        run: |
          Copy-Item upstream/COMMUNITY-RECOVERY.md,upstream/LICENSE,upstream/THIRD-PARTY-NOTICES.txt delivery/
          "Tested report commit: $env:GITHUB_SHA`nWorkflow run: $env:GITHUB_RUN_ID`nUpstream: 4fe9724ccb54422455544e56b54399fa2bc94bc3" | Set-Content delivery/BUILD.txt
          $hash = (Get-FileHash delivery/Codex-Lifeboat-Community.exe -Algorithm SHA256).Hash
          "$hash  Codex-Lifeboat-Community.exe" | Set-Content delivery/SHA256.txt
          Compress-Archive delivery/* Codex-Lifeboat-Community-Windows.zip
          Get-ChildItem upstream/src,upstream/benchmarks -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Copy-Item performance/benchmarks benchmark-tool -Recurse
          Get-ChildItem benchmark-tool -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive upstream/src,upstream/benchmarks,upstream/docs,upstream/COMMUNITY-RECOVERY.md,upstream/LICENSE,upstream/THIRD-PARTY-NOTICES.txt,upstream/pyproject.toml,upstream/requirements-build.txt,upstream/requirements-dev.txt,upstream/build.ps1,upstream/version_info.txt,benchmark-tool Codex-Lifeboat-Community-Sources.zip
          Compress-Archive benchmark-delivery/* Lifeboat-Benchmark-Windows.zip
          Get-FileHash Codex-Lifeboat-Community-*.zip,Lifeboat-Benchmark-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256.txt
      - name: Publish tested community prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "community-recovery-$env:GITHUB_RUN_NUMBER"
          $notes = "Community recovery build based on upstream v3.4.11 (MIT). Tested source: $env:GITHUB_SHA. Windows run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID. Includes durable resume, startup plan loading, complete Defender reminders, opt-in archive blocks and bounded local conversation pre-read. Read COMMUNITY-RECOVERY.md for scope and limits. No application-cache preload or two-hour guarantee for the historical backup."
          $notes | Set-Content release-notes.txt
          gh release create $tag Codex-Lifeboat-Community-Windows.zip Codex-Lifeboat-Community-Sources.zip Lifeboat-Benchmark-Windows.zip SHA256.txt --prerelease --target $env:GITHUB_SHA --title "Codex Lifeboat Community Recovery (build $env:GITHUB_RUN_NUMBER)" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Collect evidence on one volume
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          foreach ($name in @('lb-feat','lb-exe','lb-resume','lb-archive','lb-warm')) {
            if (Test-Path "C:/$name") { Get-ChildItem "C:/$name/*test-result.json" | Copy-Item -Destination { "evidence/$name-$($_.Name)" } }
          }
          if (Test-Path ui-evidence) { Copy-Item ui-evidence evidence/ -Recurse }
          if (Test-Path benchmark-ui-evidence) { Copy-Item benchmark-ui-evidence evidence/ -Recurse }
          if (Test-Path C:/lb-bench-quick) { Get-ChildItem C:/lb-bench-quick/benchmark-lifeboat-* | Copy-Item -Destination evidence/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Restore-feature-regression
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: Community-Recovery-Completion-Windows
          path: |
            Codex-Lifeboat-Community-Windows.zip
            Codex-Lifeboat-Community-Sources.zip
            Lifeboat-Benchmark-Windows.zip
            SHA256.txt

name: Complete Windows benchmark delivery
on:
  workflow_dispatch:
concurrency:
  group: benchmark-delivery-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dkwolf1/Codex-Lifeboat
          ref: 4fe9724ccb54422455544e56b54399fa2bc94bc3
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: dkwolf1/Codex-Lifeboat
          ref: 4fe9724ccb54422455544e56b54399fa2bc94bc3
          path: final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install pyinstaller==6.16.0 zstandard==0.25.0 Pillow==11.3.0
      - name: Reconstruct final sources using all release patches
        working-directory: final
        shell: pwsh
        run: |
          python -c "from pathlib import Path; paths=list(Path('src').rglob('*.py'))+[Path('../performance/optimizations/restore-first-pass.patch'),Path('../features/resume-copy-foundation.patch'),Path('../features/completion.patch')]; [p.write_bytes(p.read_bytes().replace(bytes([13,10]),bytes([10]))) for p in paths]"
          git apply ../performance/optimizations/restore-first-pass.patch
          if ($LASTEXITCODE -ne 0) { throw 'Performance patch failed' }
          git apply ../features/resume-copy-foundation.patch
          if ($LASTEXITCODE -ne 0) { throw 'Recovery patch failed' }
          git apply ../features/completion.patch
          if ($LASTEXITCODE -ne 0) { throw 'Completion patch failed' }
      - name: Report, stop, cancellation and ownership tests
        run: python -m unittest discover -s performance/benchmarks -v
      - name: UI acceptance with fake Defender and screenshots
        run: python performance/benchmarks/verify_benchmark_gui.py --directory benchmark-ui-evidence
      - name: Build UI and separate original/final workers
        shell: pwsh
        run: ./performance/benchmarks/build-windows.ps1 -BaselineSource baseline/src -FinalSource final/src -OutputDirectory benchmark-delivery
      - name: Packaged quick campaign with final checkpoints
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$pwd/benchmark-delivery/Lifeboat-Benchmark.exe" -ArgumentList '--headless --mode quick --focus all --include-archives --directory C:/lb-bench-quick' -Wait -PassThru
          $report = Get-ChildItem C:/lb-bench-quick/benchmark-lifeboat-*.json | Sort-Object Name | Select-Object -Last 1
          if (-not $report) { throw 'Missing quick report' }
          $r = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.passed -or $r.trials.Count -ne $r.planned_trials) { throw 'Packaged quick campaign failed' }
          if (-not (Test-Path ([IO.Path]::ChangeExtension($report.FullName, '.txt')))) { throw 'Missing readable report' }
          $final = @($r.trials | Where-Object { $_.kind -eq 'restore' -and $_.variant -ne 'baseline' })
          if ($final.Count -ne 4 -or @($final | Where-Object { -not $_.durable_checkpoints -or -not $_.final_verification }).Count) { throw 'Final checkpoints or verification missing' }
          if ($r.trials.Count -ne 12 -or -not $r.archive_comparisons.small -or -not $r.archive_comparisons.large) { throw 'Missing archive comparison' }
          $r.comparisons | ConvertTo-Json -Depth 6
          $r.archive_comparisons | ConvertTo-Json -Depth 6
          Get-Content ([IO.Path]::ChangeExtension($report.FullName, '.txt'))
      - name: Package reviewed benchmark artifacts
        shell: pwsh
        run: Compress-Archive -Path benchmark-delivery/* -DestinationPath Lifeboat-Benchmark-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lifeboat-Benchmark-Windows
          path: Lifeboat-Benchmark-Windows.zip
      - name: Collect reports and UI evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-evidence | Out-Null
          foreach ($folder in @('C:/lb-bench-quick')) {
            if (Test-Path $folder) { Get-ChildItem "$folder/benchmark-lifeboat-*" -File | Copy-Item -Destination benchmark-evidence }
          }
          if (Test-Path benchmark-ui-evidence) { Copy-Item benchmark-ui-evidence benchmark-evidence/ -Recurse }
          if (Test-Path benchmark-delivery/BENCHMARK-BUILD.json) { Copy-Item benchmark-delivery/BENCHMARK-BUILD.json benchmark-evidence/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Final-Benchmark-Evidence
          path: benchmark-evidence/
